<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>나는야 꼬마 영양교사</title><style>*{box-sizing:border-box}body{margin:0;background:#fff8e9;color:#28483b;font-family:system-ui,sans-serif}main{max-width:960px;margin:auto;padding:24px}header{text-align:center;padding:20px}h1{font-size:clamp(26px,5vw,42px);margin:8px}p{line-height:1.6}.tray{background:#c4d8ce;border:5px solid #9ab7a8;border-radius:28px;padding:16px;display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.slot{min-height:100px;background:#f8fcfa;border:2px dashed #a3b9ac;border-radius:18px;display:grid;place-content:center;text-align:center;cursor:pointer}.emoji{font-size:38px}.foods{display:grid;grid-template-columns:repeat(auto-fit,minmax(100px,1fr));gap:10px}button{font:inherit;cursor:pointer;border:0;border-radius:14px;padding:12px;background:white;color:inherit;box-shadow:0 3px 0 #dedbcf}button:focus-visible{outline:3px solid #245dba}button[aria-pressed=true]{background:#cce9bd;box-shadow:0 3px 0 #81a971}.actions{display:flex;gap:12px;margin:24px 0}.primary{background:#34764e;color:white;flex:1;font-weight:bold}.result{background:white;border-radius:20px;padding:20px;margin-bottom:20px}.tag{display:inline-block;background:#f5dca0;padding:6px 14px;border-radius:30px;font-weight:bold}small{color:#52695d}h2{font-size:22px}</style><main><header><span class="tag">3~4학년 영양 미션</span><h1>🍽️ 나는야 꼬마 영양교사!</h1><p>다양한 음식을 골라 나만의 급식판을 완성해 보세요.</p></header><h2>나의 급식판 <small id="count"></small></h2><div class="tray" id="tray"></div><p>음식을 누르면 급식판에 담겨요. 다시 누르면 뺄 수 있어요.</p><h2>음식 카드</h2><div class="foods" id="foods"></div><div class="actions"><button class="primary" id="grade">급식판 확인하기</button><button id="reset">다시 하기</button></div><section class="result" id="result" hidden aria-live="polite"></section><small>이 활동은 식품군의 다양성을 알아보는 연습입니다. 실제 영양량이나 한 끼의 적정 섭취량을 평가하지 않습니다. 우유·유제품은 다른 끼니나 간식으로 먹어도 좋아요.</small></main><script>const foods=[['🍚','쌀밥',0],['🍠','고구마',0],['🍞','식빵',0],['🍗','닭구이',1],['🥚','달걀찜',1],['🐟','생선구이',1],['🫘','콩조림',1],['🥦','브로콜리',2],['🥕','당근',2],['🥬','시금치',2],['🍎','사과',3],['🍇','포도',3],['🍊','귤',3],['🥛','우유',4],['🧀','치즈',4],['🍩','도넛',5],['🥤','탄산음료',5],['🍬','사탕',5]];const groups=['곡류','고기·생선·달걀·콩류','채소류','과일류','우유·유제품류'];let selected=[];const tray=document.querySelector('#tray'),cards=document.querySelector('#foods'),result=document.querySelector('#result');function toggle(i){if(selected.includes(i))selected=selected.filter(x=>x!==i);else if(selected.length<6)selected.push(i);else{alert('급식판이 가득 찼어요! 음식을 하나 빼 주세요.');return}result.hidden=true;render()}function render(){document.querySelector('#count').textContent=selected.length+'/6';tray.replaceChildren();for(let j=0;j<6;j++){let b=document.createElement('button');b.className='slot';let i=selected[j];b.innerHTML=i===undefined?'빈 칸':`<span class="emoji">${foods[i][0]}</span>${foods[i][1]}`;b.disabled=i===undefined;b.onclick=()=>toggle(i);tray.append(b)}cards.replaceChildren();foods.forEach((f,i)=>{let b=document.createElement('button');b.setAttribute('aria-pressed',selected.includes(i));b.innerHTML=`<div class="emoji">${f[0]}</div>${f[1]}`;b.onclick=()=>toggle(i);cards.append(b)})}document.querySelector('#reset').onclick=()=>{selected=[];result.hidden=true;render()};document.querySelector('#grade').onclick=()=>{if(!selected.length){alert('음식을 먼저 골라 주세요!');return}let found=new Set(selected.map(i=>foods[i][2]));result.innerHTML='<h2>나의 급식판 결과</h2>'+groups.map((g,i)=>`<p>${found.has(i)?'✅':'○'} ${g} — ${found.has(i)?'선택했어요':'아직 선택하지 않았어요'}</p>`).join('')+`<strong>${groups.every((_,i)=>found.has(i))?'다섯 식품군을 모두 골랐어요!':'다른 식품군도 골라 보거나 다른 끼니에 챙겨 보세요.'}</strong>`+(found.has(5)?'<p>단 간식과 음료는 가끔 적당히 즐겨요.</p>':'')+'<p>기름과 당류는 음식에 들어 있기도 하므로 별도로 담을 필요는 없어요.</p>';result.hidden=false;result.scrollIntoView({behavior:'smooth',block:'nearest'})};render()</script></html>
